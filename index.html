<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    </head>

    <body>
        <div id="qr-reader" width="600px"></div>
        <script>
            const html5QrCodeScan = new Html5Qrcode("qr-reader", { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false});
            
            function onScanSuccess(decodedText, decodedResult) {
                html5QrCodeScan.stop();
            }

            function onScanFailure(error) {

            }

            html5QrCodeScan.start( { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure);
        </script>
    </body>

</html>
