<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trial Patrol: messabzataom</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --success: #059669;
            --danger: #dc2626;
            --dark: #1f2937;
            --bg: #f3f4f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { color: var(--primary); text-align: center; margin: 0 0 16px 0; font-size: 22px; }
        .target-box {
            background: #eff6ff;
            border: 2px dashed #3b82f6;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .target-box span {
            font-size: 13px;
            color: #1e40af;
            display: block;
        }
        .target-box strong {
            font-size: 20px;
            letter-spacing: 1.5px;
            color: #1e3a8a;
            font-family: monospace;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #374151; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-size: 15px;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        
        .camera-viewport {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--dark);
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-preview {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            object-fit: cover;
            display: none;
            border: 2px solid var(--success);
        }
        canvas { display: none; }
        
        .btn {
            background: var(--primary); color: white; border: none; padding: 13px;
            border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; margin-top: 8px;
        }
        .btn-capture { background: var(--dark); }
        .btn-success { background: var(--success); }
        .btn-success:disabled { background: #9ca3af; cursor: not-allowed; }
        .msg { margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; }
        .danger-text { color: var(--danger); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>🛡️ Site Patrol Verification</h2>
    
    <!-- Signage Indicator -->
    <div class="target-box">
        <span>Target Signage Code:</span>
        <strong>messabzataom</strong>
    </div>

    <div class="form-group">
        <label for="officer-name">Active Duty Officer Name:</label>
        <input type="text" id="officer-name" placeholder="Enter full name" required>
    </div>

    <div class="form-group">
        <label for="checkpoint-input">Station Checkpoint:</label>
        <input type="text" id="checkpoint-input" value="Checkpoint: messabzataom" readonly style="background:#f9fafb; font-weight:600;">
    </div>

    <!-- Live Camera Verification Module -->
    <div class="form-group">
        <label>Proximity Check (Stand within 2m & snap the sign):</label>
        <button type="button" class="btn btn-capture" id="start-cam-btn" onclick="initiateCamera()">Open Verification Camera</button>
        
        <div class="camera-viewport" id="viewport-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <img id="captured-snapshot" class="photo-preview" alt="Snapshot Preview">
        <button type="button" class="btn" id="snap-btn" onclick="executeCapture()" style="display:none;">Snap Point Photo</button>
        <canvas id="processing-canvas"></canvas>
    </div>

    <!-- Questionnaire -->
    <form id="submission-form" onsubmit="processLogSubmission(event)">
        <div class="form-group">
            <label for="condition">Area Status:</label>
            <select name="condition" id="condition" required>
                <option value="Secure / All Clear">Secure / All Clear</option>
                <option value="Maintenance Required">Maintenance Required</option>
                <option value="Security Exception Noted">Security Exception Noted</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Observations / Notes:</label>
            <textarea name="notes" id="notes" rows="2" placeholder="Enter site notes..."></textarea>
        </div>
        <button type="submit" class="btn btn-success" id="submit-btn" disabled>Submit (Take Photo to Unlock)</button>
    </form>
    
    <div id="status-feedback" class="msg"></div>
</div>

<script>
    // ========================================================
    // ⚙️ GOOGLE APPS SCRIPT WEB APP URL
    // Replace with your URL from Deploy -> Web App (must end in /exec)
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0UwN_OPDvBuVQPy4AQNQtdEmUDsEKlIOdaUhFIZnqq4XDDbYwDhZLsdYA9lq5BjoaPg/exec";

    let activeStream = null;
    let photoVerificationTag = "";

    function initiateCamera() {
        const video = document.getElementById('webcam');
        const viewport = document.getElementById('viewport-container');
        const snapBtn = document.getElementById('snap-btn');
        const startBtn = document.getElementById('start-cam-btn');
        const feedback = document.getElementById('status-feedback');

        feedback.innerText = "";
        
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }, 
            audio: false 
        })
        .then(stream => {
            activeStream = stream;
            video.srcObject = stream;
            viewport.style.display = "block";
            snapBtn.style.display = "block";
            startBtn.style.display = "none";
            document.getElementById('captured-snapshot').style.display = "none";
        })
        .catch(err => {
            feedback.className = "msg danger-text";
            feedback.innerText = "Error: Rear camera access is required to unlock this form.";
        });
    }

    function executeCapture() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('processing-canvas');
        const context = canvas.getContext('2d');
        const previewImg = document.getElementById('captured-snapshot');
        const submitBtn = document.getElementById('submit-btn');
        const startBtn = document.getElementById('start-cam-btn');
        const feedback = document.getElementById('status-feedback');

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64Data = canvas.toDataURL('image/jpeg', 0.4);
        previewImg.src = base64Data;
        previewImg.style.display = "block";

        const timestamp = new Date().toISOString();
        photoVerificationTag = `[VERIFIED LIVE CAPTURE | Time: ${timestamp} | Hash: ${base64Data.slice(-32)}]`;

        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
        }
        document.getElementById('viewport-container').style.display = "none";
        document.getElementById('snap-btn').style.display = "none";
        startBtn.style.display = "block";
        startBtn.innerText = "Retake Photo";

        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Checkpoint Log";
        feedback.className = "msg success-text";
        feedback.innerText = "Live verification snapshot captured. Form unlocked.";
    }

    function processLogSubmission(event) {
        event.preventDefault();
        const feedback = document.getElementById("status-feedback");
        const officerName = document.getElementById("officer-name").value.trim();
        const checkpoint = document.getElementById("checkpoint-input").value;
        const condition = document.getElementById("condition").value;
        const notes = document.getElementById("notes").value.trim();

        if (!officerName) {
            feedback.className = "msg danger-text";
            feedback.innerText = "Please enter the Officer Name.";
            return;
        }

        if (!photoVerificationTag) {
            feedback.className = "msg danger-text";
            feedback.innerText = "You must capture a live photo before submitting.";
            return;
        }

        feedback.className = "msg";
        feedback.innerText = "Acquiring GPS snapshot & saving log...";

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const gpsInfo = `[GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} ±${Math.round(pos.coords.accuracy)}m]`;
                sendPayload(officerName, checkpoint, condition, `${gpsInfo} ${photoVerificationTag} Notes: ${notes}`);
            },
            () => {
                sendPayload(officerName, checkpoint, condition, `[GPS: Unavailable/Indoor] ${photoVerificationTag} Notes: ${notes}`);
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    function sendPayload(officer, checkpoint, condition, combinedNotes) {
        const feedback = document.getElementById("status-feedback");
        const submitBtn = document.getElementById("submit-btn");

        const data = {
            officer: officer,
            checkpoint: checkpoint,
            condition: condition,
            notes: combinedNotes
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            feedback.className = "msg success-text";
            feedback.innerText = "✔ Log recorded successfully in your Google Sheet!";
            
            document.getElementById("notes").value = "";
            submitBtn.disabled = true;
            submitBtn.innerText = "Submit (Take Photo to Unlock)";
            document.getElementById('captured-snapshot').style.display = "none";
            document.getElementById('start-cam-btn').innerText = "Open Verification Camera";
            photoVerificationTag = "";
        })
        .catch(() => {
            feedback.className = "msg danger-text";
            feedback.innerText = "Submission failed. Please check internet connection.";
        });
    }
</script>
</body>
</html>
