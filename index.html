<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Site Patrol Guard</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --success: #059669;
            --danger: #dc2626;
            --dark: #1f2937;
            --bg: #f3f4f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { color: var(--primary); text-align: center; margin: 0 0 14px 0; font-size: 22px; }
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;
        }
        .badge-pending { background: #fee2e2; color: var(--danger); }
        .badge-ok { background: #d1fae5; color: var(--success); }
        .card {
            border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 14px; background: #f9fafb;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #374151; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-size: 15px;
        }
        .camera-box {
            width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 12px;
            overflow: hidden; position: relative; display: none; margin-bottom: 10px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%; border: 2px dashed #10b981; border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px;
            border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; margin-top: 6px;
        }
        .btn-success { background: var(--success); }
        .btn-success:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-calib { background: #6b7280; font-size: 12px; padding: 6px; margin-bottom: 10px; }
        .msg { margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; }
        .danger-text { color: var(--danger); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>🛡️ Proximity Patrol Guard</h2>

    <!-- Coordinate Finder Tool for Admin/Setup -->
    <button type="button" class="btn btn-calib" onclick="revealCurrentCoords()">📍 Get My Current GPS (For Adding New Checkpoints)</button>
    <div id="calib-display" style="font-size:12px; margin-bottom:10px; color:#1e40af; text-align:center;"></div>

    <div class="form-group">
        <label for="officer-name">Officer Name:</label>
        <input type="text" id="officer-name" placeholder="Type your full name" required>
    </div>

    <!-- Select Location Dropdown -->
    <div class="form-group">
        <label for="checkpoint-selector">Select Checkpoint to Inspect:</label>
        <select id="checkpoint-selector" onchange="onCheckpointChange()">
            <option value="messabzataom">Station 1 (Code: messabzataom)</option>
            <option value="juwinKwe">Main gate (Code: juwinKwe)</option>
        </select>
    </div>

    <!-- Step 1: GPS Geofence Check -->
    <div class="card" id="gps-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>1. Location Geofence</strong>
            <span id="gps-badge" class="badge badge-pending">Waiting</span>
        </div>
        <p id="target-desc" style="font-size:12px; color:#6b7280; margin:6px 0;">Target: Station 1 (Tolerance: 10m)</p>
        <button type="button" class="btn" onclick="verifyGPSPresence()">Verify Physical GPS Location</button>
        <div id="gps-msg" class="msg"></div>
    </div>

    <!-- Step 2: Camera Code Scanner -->
    <div class="card" id="cam-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>2. Physical Code Scanner</strong>
            <span id="code-badge" class="badge badge-pending">Locked</span>
        </div>
        <p id="code-desc" style="font-size:12px; color:#6b7280; margin:6px 0;">Scan the physical QR code: messabzataom</p>

        <button type="button" class="btn" id="start-cam-btn" onclick="startScanner()" disabled>Activate Checkpoint Scanner</button>

        <div class="camera-box" id="cam-box">
            <video id="webcam" playsinline></video>
            <div class="scan-overlay"></div>
        </div>
        <canvas id="qr-canvas" style="display:none;"></canvas>
        <div id="scanner-msg" class="msg"></div>
    </div>

    <!-- Step 3: Checkpoint Questionnaire -->
    <form id="submission-form" onsubmit="processLogSubmission(event)">
        <div class="form-group">
            <label for="condition">Area Condition:</label>
            <select name="condition" id="condition" required>
                <option value="Secure / All Clear">Secure / All Clear</option>
                <option value="Maintenance Flagged">Maintenance Flagged</option>
                <option value="Security Violation">Security Violation</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Observations:</label>
            <textarea name="notes" id="notes" rows="2" placeholder="Field report notes..."></textarea>
        </div>
        <button type="submit" class="btn btn-success" id="submit-btn" disabled>Submit Verified Checkpoint</button>
    </form>

    <div id="status-feedback" class="msg"></div>
</div>

<script>
    // ========================================================
    // ⚙️ CONFIGURATION: Checkpoint Registry
    // Add new checkpoints here with their Name, QR code, and GPS coordinates
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7HVGhMFj9Dp8S2vAH9ZwugfdYYP-eYBk1oqoYVPd_IodMvjSGjl_-GaZC_5UlxuHPmQ/exec";

    const CHECKPOINTS = {
        "messabzataom": {
            name: "Station 1",
            code: "messabzataom",
            lat: 29.70873,
            lon: 32.29259
        },
        "juwinKwe": {
            name: "Main gate",
            code: "juwinKwe",
            // NOTE: Replace these with the actual coordinates of Main Gate
            lat: 29.70885,
            lon: 32.29270
        }
    };

    const MAX_ALLOWED_DISTANCE_METERS = 10;

    // State Variables
    let currentCheckpointKey = "messabzataom";
    let verifiedGPS = { lat: null, lon: null, accuracy: null, distance: null };
    let codeVerified = false;
    let scanStream = null;
    let scanInterval = null;

    // Switch checkpoint when user selects from dropdown
    function onCheckpointChange() {
        currentCheckpointKey = document.getElementById("checkpoint-selector").value;
        const target = CHECKPOINTS[currentCheckpointKey];

        // Reset verification states
        document.getElementById("target-desc").innerText = `Target: ${target.name} (Tolerance: ${MAX_ALLOWED_DISTANCE_METERS}m)`;
        document.getElementById("code-desc").innerText = `Scan the physical QR code: ${target.code}`;

        document.getElementById("gps-badge").className = "badge badge-pending";
        document.getElementById("gps-badge").innerText = "Waiting";
        document.getElementById("gps-msg").innerText = "";

        document.getElementById("code-badge").className = "badge badge-pending";
        document.getElementById("code-badge").innerText = "Locked";
        document.getElementById("scanner-msg").innerText = "";

        document.getElementById("start-cam-btn").disabled = true;
        document.getElementById("submit-btn").disabled = true;

        codeVerified = false;
        verifiedGPS = { lat: null, lon: null, accuracy: null, distance: null };
    }

    // Admin tool: Walk to a gate, click this, and get exact GPS coordinates
    function revealCurrentCoords() {
        const out = document.getElementById("calib-display");
        out.innerText = "Querying phone GPS sensor...";
        navigator.geolocation.getCurrentPosition((pos) => {
            out.innerHTML = `📍 <b>Your Current Location:</b><br>Latitude: <code>${pos.coords.latitude}</code><br>Longitude: <code>${pos.coords.longitude}</code><br>Accuracy: ±${Math.round(pos.coords.accuracy)}m`;
        }, (err) => {
            out.innerText = "Error acquiring GPS: " + err.message;
        }, { enableHighAccuracy: true });
    }

    // Haversine Distance Formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 1. GPS Geofence Check
    function verifyGPSPresence() {
        const msg = document.getElementById("gps-msg");
        const badge = document.getElementById("gps-badge");
        const target = CHECKPOINTS[currentCheckpointKey];

        msg.className = "msg";
        msg.innerText = "Acquiring satellite lock...";

        navigator.geolocation.getCurrentPosition((pos) => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;
            const accuracy = Math.round(pos.coords.accuracy);
            const distance = Math.round(calculateDistance(userLat, userLon, target.lat, target.lon));

            verifiedGPS = { lat: userLat, lon: userLon, accuracy: accuracy, distance: distance };
            const effectiveTolerance = Math.max(MAX_ALLOWED_DISTANCE_METERS, accuracy);

            if (distance <= effectiveTolerance) {
                badge.className = "badge badge-ok";
                badge.innerText = "Verified ✔️";
                msg.className = "msg success-text";
                msg.innerText = `In range (${distance}m from ${target.name}, ±${accuracy}m accuracy).`;
                document.getElementById("start-cam-btn").disabled = false;
            } else {
                badge.className = "badge badge-pending";
                badge.innerText = "Out of Range";
                msg.className = "msg danger-text";
                msg.innerText = `Too far (${distance}m away). Must be within ${MAX_ALLOWED_DISTANCE_METERS}m of ${target.name}.`;
                document.getElementById("start-cam-btn").disabled = true;
            }
        }, () => {
            msg.className = "msg danger-text";
            msg.innerText = "Location permission denied or GPS unavailable.";
        }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
    }

    // 2. Camera Scanner
    function startScanner() {
        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const msg = document.getElementById("scanner-msg");
        const target = CHECKPOINTS[currentCheckpointKey];

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        })
            .then((stream) => {
                scanStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                camBox.style.display = "block";
                msg.className = "msg";
                msg.innerText = `Scan QR Code containing: "${target.code}"`;

                scanInterval = setInterval(scanFrame, 200);
            })
            .catch(() => {
                msg.className = "msg danger-text";
                msg.innerText = "Camera permission denied.";
            });
    }

    function scanFrame() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("qr-canvas");
        const context = canvas.getContext("2d");
        const msg = document.getElementById("scanner-msg");
        const badge = document.getElementById("code-badge");
        const submitBtn = document.getElementById("submit-btn");
        const target = CHECKPOINTS[currentCheckpointKey];

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                if (code.data.trim() === target.code) {
                    clearInterval(scanInterval);
                    if (scanStream) {
                        scanStream.getTracks().forEach(t => t.stop());
                    }
                    document.getElementById("cam-box").style.display = "none";

                    codeVerified = true;
                    badge.className = "badge badge-ok";
                    badge.innerText = "Matched ✔️";
                    msg.className = "msg success-text";
                    msg.innerText = `Code Verified: "${target.code}" recognized!`;

                    submitBtn.disabled = false;
                } else {
                    msg.className = "msg danger-text";
                    msg.innerText = `Wrong QR code scanned ("${code.data.substring(0, 15)}..."). Need "${target.code}".`;
                }
            }
        }
    }

    // 3. Submit Log to Google Apps Script
    function processLogSubmission(event) {
        event.preventDefault();
        const feedback = document.getElementById("status-feedback");
        const submitBtn = document.getElementById("submit-btn");
        const officerName = document.getElementById("officer-name").value.trim();
        const condition = document.getElementById("condition").value;
        const notes = document.getElementById("notes").value.trim();
        const target = CHECKPOINTS[currentCheckpointKey];

        if (!officerName) {
            feedback.className = "msg danger-text";
            feedback.innerText = "Please enter Officer Name.";
            return;
        }

        if (!codeVerified) {
            feedback.className = "msg danger-text";
            feedback.innerText = "Physical QR scan required.";
            return;
        }

        feedback.className = "msg";
        feedback.innerText = "Recording patrol entry in Google Sheets...";
        submitBtn.disabled = true;

        const dataPayload = {
            officer: officerName,
            checkpoint: `${target.name} (${target.code})`,
            condition: condition,
            latitude: verifiedGPS.lat,
            longitude: verifiedGPS.lon,
            accuracy: verifiedGPS.accuracy,
            distance: verifiedGPS.distance,
            notes: notes
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(dataPayload)
        })
            .then(() => {
                feedback.className = "msg success-text";
                feedback.innerText = `✔ Patrol entry for ${target.name} recorded successfully!`;
                document.getElementById("notes").value = "";
                submitBtn.innerText = "Logged Successfully";
            })
            .catch(() => {
                feedback.className = "msg danger-text";
                feedback.innerText = "Transmission failed. Check internet.";
                submitBtn.disabled = false;
            });
    }
</script>
</body>
</html>
